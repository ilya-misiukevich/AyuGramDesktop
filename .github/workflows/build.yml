name: Build Windows

# Собирает Telegram.exe из чистого кода AyuGram + изменений из custom/.
# Запуск: вкладка Actions -> Build Windows -> Run workflow,
# а также автоматически при обновлении ветки dev (например, после Sync fork).

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'

concurrency:
  group: build-windows
  cancel-in-progress: true

env:
  PREPARE_PATH: Telegram/build/prepare/prepare.py
  API_ID: "2040"
  API_HASH: b18441a1ff607e10a989891a5462e627

defaults:
  run:
    shell: cmd

jobs:

  # Шаг 1: библиотеки (Qt, ffmpeg, OpenSSL и т.д.). Долго только в первый раз,
  # дальше берутся из кэша. Кэш сохраняется и при ошибке: следующий запуск
  # продолжит с того места, где остановился.
  libraries:
    name: Libraries
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild\tdesktop

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/tdesktop/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum $TBUILD/tdesktop/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "release" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          git config --global user.email "build@localhost"
          git config --global user.name "Build"

      - name: Native Tools Command Prompt.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-third-party-${{ env.CACHE_KEY }}-
            win-third-party-

      - name: Restore Libraries.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: win-x64-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-x64-libs-${{ env.CACHE_KEY }}-
            win-x64-libs-

      - name: Restore Qt.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: win-x64-qt-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-x64-qt-${{ env.CACHE_KEY }}-
            win-x64-qt-

      - name: Fix prepare script.
        run: |
          python %TBUILD%\tdesktop\custom\apply.py prepare

      - name: Libraries.
        shell: pwsh
        run: |
          & cmd /c "%TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent 2>&1" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\prepare.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check what was built.
        id: built
        if: success() || failure()
        shell: bash
        run: |
          if [ -f prepare.log ] && grep -q "BUILDING:" prepare.log; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Free up some disk space.
        if: success() || failure()
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Save ThirdParty.
        if: (success() || failure()) && steps.built.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Libraries.
        if: (success() || failure()) && steps.built.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: win-x64-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save Qt.
        if: (success() || failure()) && steps.built.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: win-x64-qt-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show log on failure.
        if: failure()
        shell: bash
        run: |
          for f in prepare.log; do
            [ -f "$f" ] || continue
            errs=$(tr -d '\r' < "$f" | grep -E 'error C|error LNK|CMake Error|FAILED|Traceback|Error:|error:' | head -n 30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            [ -n "$errs" ] && echo "::error title=$f errors::$errs"
            tail_=$(tr -d '\r' < "$f" | grep -v '^[[:space:]]*$' | tail -n 40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$f tail::$tail_"
          done

  # Шаг 2: изменения из custom/ и сборка Telegram.exe (Release, без автообновления).
  build:
    name: Telegram
    needs: libraries
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild\tdesktop

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/tdesktop/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum $TBUILD/tdesktop/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "release" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          git config --global user.email "build@localhost"
          git config --global user.name "Build"

      - name: Native Tools Command Prompt.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Restore ThirdParty.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win-third-party-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-third-party-${{ env.CACHE_KEY }}-
            win-third-party-

      - name: Restore Libraries.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: win-x64-libs-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-x64-libs-${{ env.CACHE_KEY }}-
            win-x64-libs-

      - name: Restore Qt.
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: win-x64-qt-${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            win-x64-qt-${{ env.CACHE_KEY }}-
            win-x64-qt-

      - name: Fix prepare script.
        run: |
          python %TBUILD%\tdesktop\custom\apply.py prepare

      - name: Libraries.
        shell: pwsh
        run: |
          & cmd /c "%TBUILD%\tdesktop\Telegram\build\prepare\win.bat silent 2>&1" | Tee-Object -FilePath "$env:GITHUB_WORKSPACE\prepare.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Apply custom changes.
        run: |
          python %TBUILD%\tdesktop\custom\apply.py

      - name: Build.
        shell: pwsh
        run: |
          $log = "$env:GITHUB_WORKSPACE\build.log"
          cd "$env:TBUILD\tdesktop\Telegram"
          & cmd /c "configure.bat x64 -D TDESKTOP_API_ID=%API_ID% -D TDESKTOP_API_HASH=%API_HASH% -D CMAKE_CONFIGURATION_TYPES=Release -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON 2>&1" | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & cmd /c "cmake --build ..\out --config Release --target Telegram --parallel 2>&1" | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Collect files.
        run: |
          set OUT=%TBUILD%\tdesktop\out\Release
          mkdir artifact
          copy %OUT%\Telegram.exe artifact\
          if exist %OUT%\modules xcopy /E /I /Y %OUT%\modules artifact\modules

      - name: Upload.
        uses: actions/upload-artifact@v7
        with:
          name: Telegram
          path: artifact\
          if-no-files-found: error
          retention-days: 30

      - name: Show log on failure.
        if: failure()
        shell: bash
        run: |
          for f in prepare.log build.log; do
            [ -f "$f" ] || continue
            errs=$(tr -d '\r' < "$f" | grep -E 'error C|error LNK|CMake Error|FAILED|Traceback|Error:|error:' | head -n 30 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            [ -n "$errs" ] && echo "::error title=$f errors::$errs"
            tail_=$(tr -d '\r' < "$f" | grep -v '^[[:space:]]*$' | tail -n 40 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$f tail::$tail_"
          done
